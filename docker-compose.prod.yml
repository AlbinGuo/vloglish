# 生产环境：使用 ACR 预构建镜像（配合 Gitee Go 流水线）
# 服务器上执行：docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE or run deploy/update.sh}
    env_file:
      - .env.prod
    volumes:
      - backend-data:/app/backend/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE or run deploy/update.sh}
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    profiles: ['https']
    image: caddy:2-alpine
    environment:
      DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres-data:
  backend-data:
  caddy-data:
  caddy-config:
