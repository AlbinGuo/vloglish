# 生产环境：使用 ACR 预构建镜像（配合 Gitee Go 流水线）
# 服务器上执行：docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PUBLISH:-127.0.0.1:5432}:5432'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data
    ports:
      - '${REDIS_PUBLISH:-127.0.0.1:6379}:6379'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE or run deploy/update.sh}
    env_file:
      - .env.prod
    volumes:
      - backend-data:/app/backend/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE or run deploy/update.sh}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      # 证书目录（含 en.yunankexun.com.pem / .key），只读挂载，勿打进镜像
      - ./cert:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # 若已用 nginx 自带证书做 HTTPS，请不要再启用本 profile（会与 web 抢 80/443）
  caddy:
    profiles: ['https']
    image: caddy:2-alpine
    environment:
      DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres-data:
  backend-data:
  redis-data:
  caddy-data:
  caddy-config:
