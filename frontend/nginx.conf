# 证书挂载路径：/etc/nginx/certs（见 docker-compose 的 cert 卷）
# en.yunankexun.com.pem / en.yunankexun.com.key

# ---------- HTTP：主站域名跳转到 HTTPS ----------
server {
    listen 80;
    server_name en.yunankexun.com;
    return 301 https://$host$request_uri;
}

# ---------- HTTPS：主站学习产品 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name en.yunankexun.com;

    ssl_certificate     /etc/nginx/certs/en.yunankexun.com.pem;
    ssl_certificate_key /etc/nginx/certs/en.yunankexun.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        client_max_body_size 100m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ---------- HTTP：IP / 健康检查 / 其它 Host ----------
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
