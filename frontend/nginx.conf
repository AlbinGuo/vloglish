# ---------- 介绍落地页：vloglish.cc（当前仅 HTTP，无对应证书）----------
server {
    listen 80;
    server_name vloglish.cc www.vloglish.cc;

    root /usr/share/nginx/landing;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    location /api/ {
        return 404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location = /styles.css {
        try_files /styles.css =404;
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /favicon.svg {
        try_files /favicon.svg =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        return 301 /;
    }
}
