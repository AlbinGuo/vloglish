# 落地页 vloglish.cc —— 仅介绍站，不提供学习/API

# 主站（学习产品）：IP / 其他域名
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        client_max_body_size 100m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# 介绍落地页：vloglish.cc 只能访问本页，禁止进入主站与 API
server {
    listen 80;
    server_name vloglish.cc www.vloglish.cc;

    root /usr/share/nginx/landing;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    # 禁止代理到后端
    location /api/ {
        return 404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location = /styles.css {
        try_files /styles.css =404;
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /favicon.svg {
        try_files /favicon.svg =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 其它路径一律回到落地页，避免访问 /english、/gnadmin 等
    location / {
        return 301 /;
    }
}
