# 证书挂载路径：/etc/nginx/certs（见 docker-compose 的 cert 卷）
# en.yunankexun.com.pem / en.yunankexun.com.key
#
# 规范入口：https://en.yunankexun.com
# - http://en.yunankexun.com → 301 HTTPS
# - 用 IP / 其它 Host 访问 HTTP → 301 到主站 HTTPS（保留 path/query）
# - 本机健康检查 http://127.0.0.1/api/health 仍可用（不跳转）

# ---------- HTTP：主站 → HTTPS ----------
server {
    listen 80;
    server_name en.yunankexun.com;

    # 可选：证书续期探测（若以后用 HTTP-01）
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://en.yunankexun.com$request_uri;
    }
}

# ---------- HTTPS：主站 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name en.yunankexun.com;

    ssl_certificate     /etc/nginx/certs/en.yunankexun.com.pem;
    ssl_certificate_key /etc/nginx/certs/en.yunankexun.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        client_max_body_size 100m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ---------- HTTP：IP / 其它 Host → 主站 HTTPS ----------
server {
    listen 80 default_server;
    server_name _;

    # 部署脚本 / 探针：curl http://127.0.0.1/api/health
    location = /api/health {
        proxy_pass http://backend:8000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location / {
        return 301 https://en.yunankexun.com$request_uri;
    }
}

# ---------- HTTPS：用 IP / 错误 Host 访问时尽量归到主站 ----------
# 注意：浏览器对「证书域名 ≠ IP」仍可能先告警；用户点继续后会跳到正规域名。
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/en.yunankexun.com.pem;
    ssl_certificate_key /etc/nginx/certs/en.yunankexun.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 301 https://en.yunankexun.com$request_uri;
    }
}

# ---------- 介绍落地页：vloglish.cc（仅 HTTP）----------
server {
    listen 80;
    server_name vloglish.cc www.vloglish.cc;

    root /usr/share/nginx/landing;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    location /api/ {
        return 404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location = /styles.css {
        try_files /styles.css =404;
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /favicon.svg {
        try_files /favicon.svg =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /product.html {
        try_files /product.html =404;
    }

    location = /pay.html {
        try_files /pay.html =404;
    }

    location = /commerce.css {
        try_files /commerce.css =404;
        expires 1d;
        add_header Cache-Control "public";
    }

    location / {
        return 301 /;
    }
}
