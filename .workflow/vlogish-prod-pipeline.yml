version: '1.0'
name: vlogish-prod-pipeline
displayName: Vloglish生产部署
triggers:
  trigger: auto
  push:
    branches:
      precise:
        - master
        - main
variables:
  IMAGE_TAG: ${GITEE_PIPELINE_BUILD_NUMBER}
stages:
  - name: stage-0d2131f9
    displayName: 构建镜像
    strategy: fast
    trigger: auto
    steps:
      - step: build@docker
        name: build_backend
        displayName: Backend镜像
        type: cert
        certificate: vlogish-acr
        tag: ${ACR_REGISTRY}/backend:${IMAGE_TAG}
        dockerfile: ./backend/Dockerfile
        context: .
        isCache: true
      - step: build@docker
        name: build_web
        displayName: Web镜像
        type: cert
        certificate: vlogish-acr
        tag: ${ACR_REGISTRY}/web:${IMAGE_TAG}
        dockerfile: ./frontend/Dockerfile
        context: .
        isCache: true
  - name: stage-f307c01c
    displayName: 部署生产
    strategy: fast
    trigger: auto
    steps:
      - step: shell@agent
        name: deploy_prod
        displayName: 阿里云服务器部署
        hostGroupID: ${DEPLOY_HOST_GROUP}
        script:
          - set -e
          - cd /opt/vlogish
          - export IMAGE_TAG=${GITEE_PIPELINE_BUILD_NUMBER}
          - export BACKEND_IMAGE=${ACR_REGISTRY}/backend:${IMAGE_TAG}
          - export WEB_IMAGE=${ACR_REGISTRY}/web:${IMAGE_TAG}
          - bash deploy/update.sh
          - ''
