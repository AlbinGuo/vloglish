version: '1.0'
name: branch-pipeline
displayName: 分支校验（Backend 依赖）
stages:
  - stage:
    name: compile
    displayName: 编译
    steps:
      - step: build@python
        name: build_python
        displayName: Backend 依赖检查
        pythonVersion: '3.9'
        commands:
          - pip3 config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          - pip3 install -r backend/requirements.txt
          - python3 -c "import fastapi; print('backend deps ok')"
triggers:
  push:
    branches:
      exclude:
        - master
        - main
      include:
        - .*
