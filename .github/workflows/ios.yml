# 在 macOS runner 上把 Capacitor 工程打成 iOS 安装包（.ipa）。
#
# 签名方式：App Store Connect API Key + 自动签名（Xcode 在 CI 上自动管理证书/描述文件）。
# 无需 p12 / .mobileprovision，适合没有 Mac 的 Windows 开发者。
#
# 触发：push 到 master（影响 app/frontend 的改动）、打 v* tag、或手动 dispatch。
# 产物：可安装的 .ipa。
#
# 需要配置的 Secrets / Variables 见 app/IOS_BUILD.md。

name: iOS Build

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'frontend/**'
      - 'app/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_BUNDLE_ID: cc.vloglish.app
  APP_SCHEME: App
  NODE_VERSION: '20'
  # development | ad-hoc | app-store-connect —— 默认 ad-hoc（可直接装到已登记设备）
  EXPORT_METHOD: ${{ vars.EXPORT_METHOD }}

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            app/package-lock.json

      - name: Setup Python (打包图标脚本用)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Pillow
        run: python3 -m pip install --upgrade pillow

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 app 依赖
        working-directory: app
        run: npm ci

      # ---- 构建 Web 产物（frontend -> app/www）----
      - name: 构建 Web 资源
        working-directory: app
        run: npm run build:web

      # ---- 生成 iOS 原生工程（仓库未提交 ios/ 时首次生成）----
      - name: 生成 iOS 工程
        working-directory: app
        run: |
          if [ ! -d ios ]; then
            echo "::group::npx cap add ios"
            npx @capacitor/cli add ios
            echo "::endgroup::"
          else
            echo "已存在 app/ios，跳过 cap add ios"
          fi

      # ---- 生成图标 / 启动图（含 iOS AppIcon）----
      - name: 生成品牌资源（图标 / 启动图）
        working-directory: app
        run: python3 scripts/generate-brand-assets.py

      # ---- 同步 Web 产物到原生工程并安装 Pods ----
      - name: Cap sync ios
        working-directory: app
        run: npx @capacitor/cli sync ios

      - name: pod install
        working-directory: app/ios/App
        run: pod install --repo-update

      # ---- 签名前置检查 ----
      - name: 校验 ASC API Key 是否齐备
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -z "$ASC_API_KEY_ID" ] && missing="$missing ASC_API_KEY_ID"
          [ -z "$ASC_API_ISSUER_ID" ] && missing="$missing ASC_API_ISSUER_ID"
          [ -z "$ASC_API_KEY_BASE64" ] && missing="$missing ASC_API_KEY_BASE64"
          [ -z "$APPLE_TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::缺少 Signing Secrets:$missing，请按 app/IOS_BUILD.md 配置后重试。"
            exit 1
          fi

      # ---- 写入 App Store Connect API Key（.p8）----
      - name: 写入 ASC API Key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          export ASC_API_KEY_BASE64 KEY_PATH
          python3 - <<'PY'
          import base64, os
          data = base64.b64decode(os.environ["ASC_API_KEY_BASE64"])
          with open(os.environ["KEY_PATH"], "wb") as f:
              f.write(data)
          PY
          echo "AUTH_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "已写入 API Key：$KEY_PATH"

      # ---- 归档（自动签名 + 允许云端更新证书/描述文件）----
      - name: xcodebuild archive
        working-directory: app/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          METHOD="${EXPORT_METHOD:-ad-hoc}"
          echo "导出方式：$METHOD（自动签名）"
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            clean archive

      # ---- 导出 ipa ----
      - name: 导出 ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          METHOD="${EXPORT_METHOD:-ad-hoc}"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${METHOD}</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

          ls -lh "$RUNNER_TEMP/export"

      - name: 上传 ipa 产物
        uses: actions/upload-artifact@v4
        with:
          name: vloglish-ios-${{ github.sha }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30
